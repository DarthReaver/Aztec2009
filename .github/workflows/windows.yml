name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/aztec2009 | Out-Null
          Copy-Item target/release/aztec2009.exe dist/aztec2009/
          Copy-Item "Aztec 2009.bat","build.bat","install.ps1","README.md","LICENSE" dist/aztec2009/
          Copy-Item examples dist/aztec2009/examples -Recurse
          Copy-Item docs dist/aztec2009/docs -Recurse
          Compress-Archive -Path dist/aztec2009/* -DestinationPath aztec2009-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aztec2009-windows-x86_64
          path: aztec2009-windows-x86_64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aztec2009-windows-x86_64.zip

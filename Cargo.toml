[package]
name = "aztec2009"
version = "0.1.0"
edition = "2021"
description = "Aztec 2009: a terminal-based Maya 2009 style 3D DCC tool in pure Rust"

[[bin]]
name = "aztec2009"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "gif"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }

flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
